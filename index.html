<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML → PDF 변환기</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1f1f1f; --muted: #6b6b6b;
    --border: #e3e3e0; --accent: #2f6fde; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --card: #232323; --text: #ececec; --muted: #9a9a9a;
      --border: #383838; --accent: #5b8ff0; --accent-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; display: grid; gap: 16px;
  }
  .row { display: grid; gap: 6px; }
  .row > span { font-weight: 600; }
  .row small { color: var(--muted); }
  input[type=file] { font: inherit; color: var(--text); }
  .scale { display: flex; align-items: center; gap: 12px; }
  .scale input { flex: 1; }
  .scale output { min-width: 3.5em; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer; justify-self: start;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .hint b { color: var(--text); }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  iframe {
    width: 100%; height: 70vh; margin-top: 20px; border: 1px solid var(--border);
    border-radius: 12px; background: #fff;
  }
</style>
</head>
<body>
<main>
  <h1>HTML → PDF 변환기</h1>
  <p class="sub">노션에서 내보낸 HTML의 글씨 크기를 줄여 A4 PDF로 저장합니다. 파일은 이 브라우저 안에서만 처리되며 어디에도 업로드되지 않습니다.</p>

  <div class="card">
    <label class="row">
      <span>HTML 파일</span>
      <input type="file" id="htmlFile" accept=".html,.htm">
    </label>

    <label class="row">
      <span>내보내기 폴더 (선택)</span>
      <input type="file" id="assetDir" webkitdirectory multiple>
      <small>이미지가 있다면 노션 내보내기 압축을 푼 폴더를 선택하세요. 상대 경로 이미지를 연결합니다.</small>
    </label>

    <div class="row">
      <span>글씨 크기 배율</span>
      <div class="scale">
        <input type="range" id="scale" min="0.3" max="1.5" step="0.05" value="0.5">
        <output id="scaleOut">0.50</output>
      </div>
    </div>

    <button id="printBtn" disabled>PDF로 저장</button>
    <p class="hint">인쇄 창이 열리면 대상을 <b>PDF로 저장</b>으로 선택하세요. 용지(A4)·여백(15mm)·배경색은 자동 적용됩니다.</p>
    <div id="status"></div>
  </div>

  <iframe id="preview" title="미리보기"></iframe>
</main>

<script>
  const BASE_FONT_PX = 16; // 브라우저 기본 글씨 크기

  const $ = (id) => document.getElementById(id);
  const htmlInput = $('htmlFile'), dirInput = $('assetDir');
  const scaleInput = $('scale'), scaleOut = $('scaleOut');
  const printBtn = $('printBtn'), statusEl = $('status'), preview = $('preview');

  let htmlText = null;
  let baseName = 'output';
  let assetMap = new Map(); // 상대 경로 -> blob URL

  htmlInput.addEventListener('change', async () => {
    const f = htmlInput.files[0];
    if (!f) return;
    htmlText = await f.text();
    baseName = f.name.replace(/\.html?$/i, '');
    render();
  });

  dirInput.addEventListener('change', () => {
    for (const url of assetMap.values()) URL.revokeObjectURL(url);
    assetMap = new Map();
    for (const f of dirInput.files) {
      const path = (f.webkitRelativePath || f.name).normalize('NFC');
      if (/\.html?$/i.test(path)) continue;
      assetMap.set(path, URL.createObjectURL(f));
    }
    statusEl.textContent = `폴더에서 파일 ${assetMap.size}개를 불러왔습니다.`;
    if (htmlText) render();
  });

  scaleInput.addEventListener('input', () => {
    scaleOut.textContent = Number(scaleInput.value).toFixed(2);
    if (htmlText) render();
  });

  function resolveAsset(ref) {
    let p = ref.split(/[?#]/)[0];
    try { p = decodeURIComponent(p); } catch {}
    p = p.replace(/^\.\//, '').normalize('NFC');
    if (assetMap.has(p)) return assetMap.get(p);
    for (const [key, url] of assetMap) {
      if (key.endsWith('/' + p)) return url;
    }
    return null;
  }

  function buildDoc() {
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const scale = Number(scaleInput.value);

    // 상대 경로 이미지·링크를 선택한 폴더의 파일로 연결
    let linked = 0;
    if (assetMap.size) {
      for (const el of doc.querySelectorAll('[src], [href]')) {
        for (const attr of ['src', 'href']) {
          const v = el.getAttribute(attr);
          if (!v || /^([a-z]+:|\/\/|#)/i.test(v)) continue;
          const url = resolveAsset(v);
          if (url) { el.setAttribute(attr, url); linked++; }
        }
      }
    }

    doc.title = baseName;

    // 원본 스크립트와 같은 설정: A4, 여백 15mm, 배경 유지, html 기준 글씨 크기 조정
    const style = doc.createElement('style');
    style.textContent = `
      @page { size: A4; margin: 15mm; }
      html { font-size: ${BASE_FONT_PX * scale}px !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    `;
    doc.head.appendChild(style);

    return { html: '<!doctype html>\n' + doc.documentElement.outerHTML, linked };
  }

  function render() {
    printBtn.disabled = true;
    const { html, linked } = buildDoc();
    preview.onload = () => {
      printBtn.disabled = false;
      statusEl.textContent = `준비 완료: ${baseName}.html` + (linked ? ` (연결된 파일 ${linked}개)` : '');
    };
    preview.srcdoc = html;
  }

  printBtn.addEventListener('click', () => {
    const prevTitle = document.title;
    document.title = baseName; // 저장 시 기본 파일명으로 쓰이도록
    preview.contentWindow.focus();
    preview.contentWindow.print();
    setTimeout(() => { document.title = prevTitle; }, 1000);
  });
</script>
</body>
</html>
